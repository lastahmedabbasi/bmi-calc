<!DOCTYPE html>
<html lang="en">
<head>
    <title>BMI Calculator</title>
    <script src="bmicalc.js"></script>
</head>
<body>

    <form>
        Enter your Weight <br>
        <input type="number" id="weight" placeholder="Weight in kilograms"><br><br>
        
        Enter your Height <br>
        <input type="number" id="height" placeholder="Height in cm"><br><br>
        
        Enter your Age <br>
        <input type="number" id="age" placeholder="Age"><br><br>
        
        Enter your Gender <br>
        <input type="radio" name="gender" value="male">
        <label>Male</label> <br>
        <input type="radio" name="gender" value="female">
        <label>Female</label><br>
        <input type="radio" name="gender" value="other">
        <label>Helicopter</label><br><br>
        
        <button type="button" onclick="BMICalc()">Submit</button>
    </form>
    
</body>
</html>
